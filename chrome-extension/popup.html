<!doctype html><meta charset="utf-8">
<style>body{font:14px system-ui;width:320px;padding:12px;background:#0f1115;color:#e7e9ee}input,textarea{width:100%;box-sizing:border-box;margin:4px 0 8px;padding:6px;background:#1d2129;color:#e7e9ee;border:1px solid #272c36;border-radius:6px}button{padding:7px 12px;border:0;border-radius:6px;background:#8bd49c;color:#0f1115;font-weight:600;cursor:pointer}small{color:#9aa1ad}</style>
<b>⬇️ MediaButler</b><br><small>Server-Adresse, z. B. http://192.168.1.10:8080</small>
<input id="server" placeholder="http://server:8080">
<small>API-Key (empfohlen) oder Benutzer/Passwort</small>
<input id="apiKey" type="password" placeholder="API_KEY">
<input id="user" placeholder="Benutzer (optional)"><input id="pass" type="password" placeholder="Passwort (optional)">
<button id="save">Speichern</button> <small id="m"></small>
<hr style="border-color:#272c36"><small>Links direkt senden</small>
<textarea id="links" rows="3" placeholder="Links einfügen"></textarea><button id="send">An MediaButler senden</button> <button id="ck" title="Sendet die ddownload.com-Cookies (Login mit Captcha)">Cookies senden</button>
<script src="popup.js"></script>
