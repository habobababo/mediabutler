services:
  mediabutler:
    image: ghcr.io/habobababo/mediabutler:latest   # fertiges Image von GitHub (alternativ: build: .)
    # build: .
    container_name: mediabutler
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
      - "9666:9666"   # Click'n'Load
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SOURCE_DIR: /incoming
      TARGET_DIR: /media
      DATA_DIR: /data
      PUBLIC_URL: "${PUBLIC_URL:-}"       # für Links in Telegram-Nachrichten
      AUTH_USER: "${AUTH_USER:-admin}"     # Login der Web-UI
      AUTH_PASS: "${AUTH_PASS:?AUTH_PASS fehlt: ./setup.sh ausführen oder .env ausfüllen}"
      API_KEY: "${API_KEY:-}"              # für Chrome-Plugin, LabGate, pyLoad
      MIN_AGE: "120"
      WATCH_INTERVAL: "60"
      MOVE_AFTER: "0"
    volumes:
      - ${DOWNLOADS_DIR:-./incoming}:/incoming   # Quelle (hier landen Downloads)
      - ${MEDIA_DIR:-./media}:/media             # Ziel (z. B. NFS-Share)
      - ./data:/data                             # Einstellungen + Verlauf
