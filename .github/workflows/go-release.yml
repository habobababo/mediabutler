name: go-release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        working-directory: go
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -mod=vendor -trimpath -ldflags="-s -w" -o ../mediabutler-linux-$arch .
          done
      - name: Test
        working-directory: go
        run: go test ./...
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mediabutler-linux-amd64
            mediabutler-linux-arm64
