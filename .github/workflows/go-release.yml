name: go-release
on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "vendor/**", "web/**", "chrome-extension/**", ".github/workflows/go-release.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -mod=vendor -trimpath -ldflags="-s -w" -o mediabutler-linux-$arch .
          done
      - name: Test
        run: go test ./...
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          target_commitish: ${{ github.sha }}
          files: |
            mediabutler-linux-amd64
            mediabutler-linux-arm64
